var S={w:[],r:[],m:[],s:[],p:[],prof:{},plan:null,ev:[],st:{goal:8000,d:{}},g:{kcal:2400,p:150,c:260,f:75}},tab="home",sess=null,run=null,off=null,offDur=25,REP=25,REST=10,EXD=[["Press banca","Pecho","Escápulas juntas y pies firmes; baja la barra al pecho en 2 s."],["Press inclinado mancuernas","Pecho","Banco a 30°; sube sin chocar las mancuernas arriba."],["Aperturas en polea","Pecho","Codos algo flexionados; junta las manos apretando el pecho."],["Fondos","Pecho","Inclina el torso hacia delante para cargar más el pecho."],["Dominadas","Espalda","Empieza colgado y tira con los codos hacia las caderas."],["Remo con barra","Espalda","Espalda neutra y tronco a 45°; lleva la barra al abdomen."],["Jalón al pecho","Espalda","No te balancees; baja la barra hasta la clavícula."],["Remo con mancuerna","Espalda","Apoya mano y rodilla; tira del codo hacia la cadera."],["Press militar","Hombros","Aprieta glúteos y abdomen para no arquear la espalda."],["Elevaciones laterales","Hombros","Peso ligero, sin impulso; sube hasta la altura del hombro."],["Pájaros","Hombros","Tronco inclinado; abre los brazos llevando los codos atrás."],["Curl con barra","Bíceps","Codos pegados al cuerpo y bajada lenta."],["Curl martillo","Bíceps","Agarre neutro; no balancees el torso."],["Press francés","Tríceps","Codos fijos apuntando al techo; baja hasta la frente."],["Extensión en polea","Tríceps","Codos pegados; estira del todo y aprieta abajo."],["Plancha","Core","Cuerpo en línea recta, glúteos y abdomen apretados. Cuenta 30 s como una serie."],["Elevación de piernas","Core","Zona lumbar pegada al suelo; baja sin balanceo."],["Sentadilla","Cuádriceps","Rodillas en línea con los pies; baja al menos hasta paralelo."],["Prensa","Cuádriceps","No bloquees las rodillas arriba; pies a la anchura de hombros."],["Zancadas","Cuádriceps","Paso largo y torso erguido; da el paso sin perder el equilibrio."],["Peso muerto rumano","Isquios","Cadera atrás y rodillas casi rectas; barra pegada a las piernas."],["Curl femoral","Isquios","Controla la bajada y no levantes la cadera."],["Hip thrust","Glúteos","Barbilla al pecho; aprieta los glúteos 1 s arriba."],["Elevación de talones","Gemelos","Rango completo, con pausa arriba."]],EX=EXD.map(function(x){return x[0]});

function today(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function $(x){return document.getElementById(x)}

function vol(se){return se.reduce(function(t,e){return t+e.sets.filter(function(s){return s.done}).reduce(function(u,s){return u+s.kg*s.reps},0)},0)}
function fmt(sec){var h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),s=Math.floor(sec%60);return(h?h+":":"")+String(m).padStart(2,"0")+":"+String(s).padStart(2,"0")}
function pace(km,sec){return km>0.01?fmt(sec/km).replace(/^0/,"")+" /km":"--"}
function days(n){var o=[];for(var i=n-1;i>=0;i--){o.push(new Date(Date.now()-i*864e5).toISOString().slice(0,10))}return o}

function mbar(n,v,g){return '<div style="margin:8px 0"><div class="row sp mu"><span>'+n+'</span><span>'+Math.round(v)+' / '+g+' g</span></div><div class="bar"><i style="width:'+Math.min(100,v/g*100)+'%"></i></div></div>'}

function home(){var t=tm(),rc=recovery(),tr=S.w.some(function(x){return x.date==today()}),sl=S.s.some(function(x){return x.date==today()}),h='<h1>Hola</h1><div class="card hero row sp"><div>'+ring(rc,100,rc,"recuperación")+'</div><div><div class="mu">Hoy</div><div class="big">'+Math.max(0,S.g.kcal-t.kcal)+'</div><div class="mu">kcal restantes</div></div></div>';
h+='<div class="card"><h2>Pendiente hoy</h2>'+[[tr,"Entrenamiento","gym"],[t.list.length>0,"Registrar comidas","food"],[sl,"Registrar el sueño de anoche","sleep"]].map(function(x){return '<div class="row sp" style="padding:6px 0"><span>'+(x[0]?"✓ ":"○ ")+x[1]+'</span>'+(x[0]?"":'<button data-a="go" data-v="'+x[2]+'">Ir</button>')+'</div>'}).join("")+'</div>';
var wk=days(7).map(function(d){return sum(S.w.filter(function(x){return x.date==d}),"vol")});var mx=Math.max.apply(null,wk.concat([1]));
h+='<div class="card"><h2>Volumen de la semana</h2><div class="bars">'+wk.map(function(v){return '<span style="height:'+(v/mx*100)+'%"></span>'}).join("")+'</div></div>';
var km=sum(S.r.filter(function(x){return days(7).indexOf(x.date)>-1}),"km");
h+=stepCard();h+='<div class="card stats"><div><b>'+S.w.length+'</b><span class="mu">sesiones</span></div><div><b>'+km.toFixed(1)+'</b><span class="mu">km esta semana</span></div><div><b>'+(sleepAvg()?sleepAvg().toFixed(1):"--")+'</b><span class="mu">h de sueño</span></div></div>';return h}

function gym(){var h='<h1>Gimnasio</h1>';
if(!sess){h+='<div class="card"><h2>Nueva sesión</h2><div class="mu" style="margin-bottom:6px">¿Qué vas a entrenar hoy?</div><select id="sf">'+Object.keys(FOC).map(function(k){return '<option>'+k+'</option>'}).join("")+'</select><div class="row" style="margin-top:8px"><input id="sn" placeholder="Nombre (opcional)"><button class="pr" data-a="gstart">Empezar</button></div></div>';
